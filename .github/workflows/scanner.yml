name: HH-HL scanner

on:
  schedule:
    - cron: "1,31 * * * *" # reserve; cron-job.org start de scanner op :01 en :31
  workflow_dispatch:
    inputs:
      halal_check:
        description: "Alleen halal-controle voor deze tickers (bv. NKE,DIS). Leeg = normale scan."
        required: false
        default: ""
      snapshot:
        description: "Momentopname met chart-foto's: 1 = alles, omkeer of retest."
        required: false
        default: ""
      quality_report:
        description: "Zet op 1 voor een rapport van de chart-kwaliteit (geen scan)."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: hh-hl-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      # state.json onthoudt welke meldingen al verstuurd zijn + het aandelen-universum
      - uses: actions/cache/restore@v4
        with:
          path: scanner/state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Scan
        run: python scanner/scan.py
        env:
          PYTHONWARNINGS: ignore
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HALAL_CHECK: ${{ inputs.halal_check }}
          QUALITY_REPORT: ${{ inputs.quality_report }}
          SNAPSHOT: ${{ inputs.snapshot }}
          TIMEFRAMES: ${{ vars.TIMEFRAMES }}
          MIN_VOLUME: ${{ vars.MIN_VOLUME }}
          MIN_VOLUME_STOCKS: ${{ vars.MIN_VOLUME_STOCKS }}
          HALAL: ${{ vars.HALAL }}
          HALAL_METHOD: ${{ vars.HALAL_METHOD }}
          CRYPTO_HALAL: ${{ vars.CRYPTO_HALAL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MIN_HH_PCT: ${{ vars.MIN_HH_PCT }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scanner/state.json
          key: scanner-state-${{ github.run_id }}
