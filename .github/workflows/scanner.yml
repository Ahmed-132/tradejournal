name: HH-HL scanner

on:
  schedule:
    - cron: "1,31 * * * *" # reserve; cron-job.org start de scanner op :01 en :31
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hh-hl-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      # state.json onthoudt welke meldingen al verstuurd zijn + het aandelen-universum
      - uses: actions/cache/restore@v4
        with:
          path: scanner/state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: scanner-state-

      - name: Scan
        run: python scanner/scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAMES: ${{ vars.TIMEFRAMES }}
          MIN_VOLUME: ${{ vars.MIN_VOLUME }}
          MIN_HH_PCT: ${{ vars.MIN_HH_PCT }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: scanner/state.json
          key: scanner-state-${{ github.run_id }}
